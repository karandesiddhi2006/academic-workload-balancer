version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running automated tests"
      - mkdir -p reports
      - python -m pytest --junitxml=reports/junit.xml

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t academic-workload-balancer:latest .

artifacts:
  files:
    - reports/junit.xml
  discard-paths: yes